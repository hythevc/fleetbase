map $http_x_forwarded_proto $fleetbase_scheme {
    default $scheme;
    ~*^https(?:,|$) https;
    ~*^http(?:,|$) http;
}

# Accept only host names and optional ports before inserting request data into JSON.
map $http_host $fleetbase_request_authority {
    default localhost;
    "~*^([a-z0-9.-]+|\[[0-9a-f:.]+\])(:[0-9]{1,5})?$" $http_host;
}

map $http_x_forwarded_host $fleetbase_authority {
    default $fleetbase_request_authority;
    "~*^(?<fleetbase_forwarded_authority>([a-z0-9.-]+|\[[0-9a-f:.]+\])(:[0-9]{1,5})?)(?:,|$)" $fleetbase_forwarded_authority;
}

map $fleetbase_authority $fleetbase_hostname {
    default $fleetbase_authority;
    "~*^(?<fleetbase_host_without_port>[a-z0-9.-]+|\[[0-9a-f:.]+\]):[0-9]+$" $fleetbase_host_without_port;
}

map $fleetbase_scheme $fleetbase_default_port {
    default 80;
    https 443;
}

map $fleetbase_authority $fleetbase_port {
    default $fleetbase_default_port;
    "~*^(?:[a-z0-9.-]+|\[[0-9a-f:.]+\]):(?<fleetbase_port_number>[0-9]+)$" $fleetbase_port_number;
}

map $fleetbase_scheme $fleetbase_secure {
    default false;
    https true;
}

map $http_upgrade $fleetbase_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 600M;

    # Resolve Compose services again when a container is replaced.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $fleetbase_console console:4200;
    set $fleetbase_api httpd:80;
    set $fleetbase_socket socket:8000;

    proxy_set_header Host $fleetbase_authority;
    proxy_set_header X-Forwarded-Host $fleetbase_authority;
    proxy_set_header X-Forwarded-Port $fleetbase_port;
    proxy_set_header X-Forwarded-Proto $fleetbase_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location = /fleetbase.config.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"API_HOST":"$fleetbase_scheme://$fleetbase_authority","SOCKETCLUSTER_HOST":"$fleetbase_hostname","SOCKETCLUSTER_PORT":"$fleetbase_port","SOCKETCLUSTER_SECURE":$fleetbase_secure}';
    }

    location ^~ /socketcluster/ {
        proxy_http_version 1.1;
        proxy_set_header Host $fleetbase_authority;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fleetbase_connection_upgrade;
        proxy_pass http://$fleetbase_socket;
    }

    # Keep API paths on the same origin as the SPA. Match versioned extension
    # routes without swallowing console routes like /ledger or /storefront.
    location ~ ^/(?:health$|(?:int|v[0-9]+|api|~registry|storage|sanctum|public)(?:/|$)|(?:ai|customer-portal|ledger|pallet|storefront|valhalla|vroom)/(?:int|public|v[0-9]+)(?:/|$)) {
        proxy_pass http://$fleetbase_api;
    }

    # Provide an API root and a way to reach additional extension routes.
    location ^~ /fleetbase-api/ {
        rewrite ^/fleetbase-api(/.*)$ $1 break;
        proxy_pass http://$fleetbase_api;
    }

    location / {
        proxy_pass http://$fleetbase_console;
    }
}
